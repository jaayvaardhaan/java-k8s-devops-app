name: Java App CI-CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Explicitly lock to a stable long-term support release to avoid migration warnings
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # UPGRADE: Switched from v4 to v5 to utilize the newest active release features
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Compile Java Code
      run: javac Main.java

    - name: Build Docker Image
      run: docker build -t my-first-java-app:${{ github.sha }} .
