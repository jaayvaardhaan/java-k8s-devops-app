name: Java App CI-CD Pipeline

# Trigger the pipeline automatically on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest # GitHub boots up a fresh Linux server in the cloud for free!

    steps:
    # Step 1: Download your repository code onto the runner machine
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up Java 17 environment natively on the cloud runner
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Step 3: Test compile the code to ensure the developer didn't break anything
    - name: Compile Java Code
      run: javac Main.java

    # Step 4: Build the Docker container image using your multi-stage Dockerfile
    - name: Build Docker Image
      run: docker build -t my-first-java-app:${{ github.sha }} .
